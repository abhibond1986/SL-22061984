<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Safety Lens - SAIL AI-Powered Safety">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Safety Lens">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#00226E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <link rel="manifest" href="manifest.json?v=2">
  <!-- These three used to point at app_icon.png, which was a 1 MB 1024px PNG.
       A favicon renders at 16-32 px, so that was ~1 MB of blocking download for
       nothing. favicon.png is the same artwork at 64px / ~5 KB. Bump ?v= when
       regenerating via tools/gen_icons.py so caches don't serve the old file. -->
  <link rel="icon" type="image/png" href="favicon.png?v=4"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=4"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png?v=4"/>
  <!-- flutter.js is the gate on everything else, so start fetching it during
       HTML parse instead of waiting for the tag at the end of the body. -->
  <link rel="preload" href="flutter.js" as="script"/>
  <!-- google_fonts fetches Inter/Poppins at RUNTIME from these origins, and the
       Supabase call fires during startup. Doing the DNS + TLS handshake now
       removes it from the critical path later. (Bundling the fonts locally would
       be the bigger win — noted in STATUS.md.) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preconnect" href="https://mptdergmcakhufsmcogd.supabase.co" crossorigin/>
  <title>Safety Lens · SAIL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* iOS Safe Area Support */
    html {
      height: 100%;
      height: -webkit-fill-available;
    }

    /* 2026-10-05 (user): no loading page on the web. The page is just the
       login backdrop's dark sky until Flutter paints its first frame, and the
       login screen then draws over the same colours, so the visitor sees one
       page, not a splash followed by a login. (The Android/iOS app keeps its
       own SplashScreen; this file only affects the web build.) */
    body {
      background: #00226E linear-gradient(90deg, #0A2CC8 0%, #00226E 50%, #0486B0 100%) fixed;
      font-family: -apple-system, 'Inter', sans-serif;
      overflow: hidden;
      min-height: 100vh;
      min-height: -webkit-fill-available;

      /* Safe area insets for notched devices */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);

      /* Prevent overscroll on iOS */
      position: fixed;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script>
    // ★ 2026-10-04 — Ctrl + mouse-wheel browser zoom.
    // Flutter web listens for 'wheel' and calls preventDefault() on every
    // event (it turns Ctrl+wheel into its own pinch-zoom gesture), which
    // cancels the browser's page zoom — so Ctrl+scroll did nothing on
    // safetylens.in. This capture-phase listener on window runs before
    // Flutter's (it is registered first, before the engine loads) and, for
    // Ctrl/Cmd+wheel only, stops the event reaching Flutter WITHOUT calling
    // preventDefault, so the browser performs its normal zoom and Flutter
    // simply re-lays out at the new size. Plain scrolling is untouched.
    window.addEventListener('wheel', function (e) {
      if (e.ctrlKey || e.metaKey) e.stopImmediatePropagation();
    }, { capture: true, passive: true });
  </script>
  <script src="flutter.js" defer></script>
  <script>
    // Previously this waited on window 'load', which does not fire until EVERY
    // subresource (all icons, the manifest, fonts) has finished downloading — so
    // the engine sat idle behind assets it does not need. 'DOMContentLoaded'
    // fires as soon as the document is parsed, which is the earliest point
    // flutter.js (deferred) is guaranteed to have run.
    //
    // Both listeners are attached and boot() is idempotent via `started`,
    // because this inline script runs BEFORE the deferred loader tag above, so
    // window._flutter does not exist yet at this point. Whichever event finds
    // the loader first wins; the second call returns immediately.
    (function () {
      var started = false;
      function boot() {
        if (started || !window._flutter) return;
        started = true;
        _flutter.loader.loadEntrypoint({
          onEntrypointLoaded: function (engineInitializer) {
            engineInitializer.initializeEngine().then(function (appRunner) {
              appRunner.runApp();
            });
          }
        });
      }
      if (window._flutter) boot();
      else document.addEventListener('DOMContentLoaded', boot);
      window.addEventListener('load', boot);
    })();
  </script>
</body>
</html>
