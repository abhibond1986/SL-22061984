name: Build and Deploy Safety Lens Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# ★ Prevent concurrent deployments — cancel older runs so new one proceeds
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ★ Needed so configure-pages can auto-enable Pages via `enablement: true`
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Flutter version (sanity check)
        run: flutter --version

      - name: Enable web platform
        run: flutter config --enable-web

      # Retried deliberately. There is no committed pubspec.lock, so every run
      # re-solves the whole dependency graph over the network. pub.dev
      # intermittently answers a metadata request with 403 from shared GitHub
      # Actions IPs, and pub then reports the package as
      #   "... depends on <pkg> any which doesn't exist (authorization failed)"
      # and version solving fails with exit code 69 — even though the package is
      # public and fine. That is exactly what killed run 31894635327
      # (speech_to_text -> speech_to_text_macos). It is transient, so retry
      # rather than downgrading a constraint that was never the problem.
      - name: Flutter pub get
        run: |
          for attempt in 1 2 3 4; do
            echo "::group::flutter pub get (attempt $attempt/4)"
            if flutter pub get; then
              echo "::endgroup::"
              echo "pub get succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 4 ]; then
              # A partially-written cache entry can make the failure sticky,
              # so clear it before re-resolving.
              rm -rf "${PUB_CACHE:-$HOME/.pub-cache}/_temp" || true
              delay=$((attempt * 20))
              echo "::warning::pub get failed (attempt $attempt). Retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "::error::flutter pub get failed after 4 attempts. If the log says \"doesn't exist (authorization failed)\" for a package that is public, pub.dev rate-limited this runner — re-run the job. If it persists, commit a pubspec.lock so CI stops re-solving from the network."
          exit 1

      - name: Build web (release)
        # Icon tree-shaking re-enabled 2026-08-14. It was disabled defensively,
        # but it ships the FULL MaterialIcons font (~1 MB) on the critical path.
        # Audited: `lib/` contains zero `IconData(...)` constructions and no
        # string->icon lookup maps, so every icon is a const `Icons.*` the
        # compiler can see. If a dynamic icon is ever added, tree-shaking will
        # render empty boxes at runtime with NO build error — restore
        # --no-tree-shake-icons if that ever appears.
        #
        # SL_APP_SECRET (added 2026-09-03) must match the APP_SECRET script
        # property on the Apps Script deployment. Without it the backend refuses
        # `getAiKeys` and `gemini`, so the build succeeds and then every AI
        # feature silently degrades to offline analysis — check the browser
        # console for "getAiKeys refused" if that happens. Set the repository
        # secret at Settings → Secrets and variables → Actions.
        # NOTE: this value is compiled into the JavaScript the browser
        # downloads, so it is not a secret from a logged-in user; it only stops
        # anonymous requests against the deployment URL, which is itself a
        # constant in this public repo.
        run: |
          flutter build web --release --base-href "/" \
            --dart-define=SL_APP_SECRET=${{ secrets.SL_APP_SECRET }}

      - name: List web output
        run: ls -la build/web/

      # NOTE: a step here used to `cp assets/images/app_icon.png` over both
      # build/web/app_icon.png and build/web/favicon.png. That asset was a 1 MB
      # 1024px PNG, so it put ~2 MB of images on the landing-page critical path
      # (the favicon alone renders at 16 px). web/app_icon.png and
      # web/favicon.png are now correctly-sized files committed in the repo and
      # copied by `flutter build web` itself — do not re-add that copy step.
      # Regenerate them with `python3 tools/gen_icons.py`.

      - name: Verify web icons are not oversized
        # Guard so the 1 MB regression cannot come back unnoticed.
        run: |
          for f in build/web/app_icon.png build/web/favicon.png; do
            sz=$(stat -c%s "$f")
            echo "$f = $sz bytes"
            if [ "$sz" -gt 204800 ]; then
              echo "::error::$f is $sz bytes (>200KB). Run tools/gen_icons.py."
              exit 1
            fi
          done

      - name: Add SPA fallback for routing
        run: cp build/web/index.html build/web/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # ★ Creates the Pages site if it doesn't exist yet (fixes HttpError: Not Found)
          enablement: true

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
