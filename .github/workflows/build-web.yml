name: Build and Deploy Safety Lens Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# ★ Prevent concurrent deployments — cancel older runs so new one proceeds
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ★ Needed so configure-pages can auto-enable Pages via `enablement: true`
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Flutter version (sanity check)
        run: flutter --version

      - name: Enable web platform
        run: flutter config --enable-web

      - name: Flutter pub get
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release --base-href "/SL-22061984/" --no-tree-shake-icons

      - name: List web output
        run: ls -la build/web/

      - name: Copy app icon as favicon and web root icon
        run: |
          cp assets/images/app_icon.png build/web/app_icon.png
          cp assets/images/app_icon.png build/web/favicon.png

      - name: Add SPA fallback for routing
        run: cp build/web/index.html build/web/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # ★ Creates the Pages site if it doesn't exist yet (fixes HttpError: Not Found)
          enablement: true

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
